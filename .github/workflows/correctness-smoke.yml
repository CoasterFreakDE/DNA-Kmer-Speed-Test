name: Kmer Correctness Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "c/**"
      - "cpp/**"
      - "csharp/**"
      - "coffeescript/**"
      - "erlang/**"
      - "go/**"
      - "haskell/**"
      - "java/**"
      - "js/**"
      - "lua/**"
      - "mojo/**"
      - "perl/**"
      - "php/**"
      - "python/**"
      - "rust/**"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/correctness-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "c/**"
      - "cpp/**"
      - "csharp/**"
      - "coffeescript/**"
      - "erlang/**"
      - "go/**"
      - "haskell/**"
      - "java/**"
      - "js/**"
      - "lua/**"
      - "mojo/**"
      - "perl/**"
      - "php/**"
      - "python/**"
      - "rust/**"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/correctness-smoke.yml"

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: c
          - lang: cpp
          - lang: csharp
            setup_dotnet_version: "6.x"
          - lang: coffeescript
            setup_node_version: "20"
            setup_command: "npm install --global coffeescript"
          - lang: erlang
            setup_command: "sudo apt-get update && sudo apt-get install -y erlang"
          - lang: go
          - lang: haskell
            setup_haskell_ghc: "9.0.2"
            setup_haskell_cabal: "3.6.2.0"
            setup_command: "cabal update"
          - lang: java
          - lang: js
            setup_node_version: "20"
          - lang: lua
            setup_command: "sudo apt-get update && sudo apt-get install -y luajit"
          - lang: mojo
            optional: true
          - lang: perl
          - lang: php
          - lang: python
          - lang: rust
    env:
      TEST_LENGTH: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        if: ${{ matrix.setup_dotnet_version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.setup_dotnet_version }}

      - name: Setup Node.js
        if: ${{ matrix.setup_node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.setup_node_version }}

      - name: Setup Haskell
        if: ${{ matrix.setup_haskell_ghc }}
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.setup_haskell_ghc }}
          cabal-version: ${{ matrix.setup_haskell_cabal }}

      - name: Run custom setup
        if: ${{ matrix.setup_command }}
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.setup_command }}

      - name: Validate output for ${{ matrix.lang }}
        shell: bash
        env:
          ALLOW_MISSING_RUNTIME: ${{ matrix.optional == true }}
        run: |
          set -euo pipefail
          bash scripts/test_language.sh "${{ matrix.lang }}" "${TEST_LENGTH}"
