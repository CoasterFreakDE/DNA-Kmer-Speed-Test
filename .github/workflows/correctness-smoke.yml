name: Kmer Correctness Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "c/**"
      - "cpp/**"
      - "csharp/**"
      - "coffeescript/**"
      - "erlang/**"
      - "go/**"
      - "haskell/**"
      - "java/**"
      - "js/**"
      - "lua/**"
      - "mojo/**"
      - "perl/**"
      - "php/**"
      - "python/**"
      - "rust/**"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/correctness-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "c/**"
      - "cpp/**"
      - "csharp/**"
      - "coffeescript/**"
      - "erlang/**"
      - "go/**"
      - "haskell/**"
      - "java/**"
      - "js/**"
      - "lua/**"
      - "mojo/**"
      - "perl/**"
      - "php/**"
      - "python/**"
      - "rust/**"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/correctness-smoke.yml"

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: c
          - lang: cpp
          - lang: csharp
            setup_dotnet_version: "7.x"
          - lang: coffeescript
            setup_node_version: "20"
            setup_command: "npm install --global coffeescript"
          - lang: erlang
          - lang: go
          - lang: haskell
          - lang: java
          - lang: js
            setup_node_version: "20"
          - lang: lua
            setup_command: "sudo apt-get update && sudo apt-get install -y luajit"
          - lang: mojo
            optional: true
          - lang: perl
          - lang: php
          - lang: python
          - lang: rust
    env:
      TEST_LENGTH: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        if: ${{ matrix.setup_dotnet_version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.setup_dotnet_version }}

      - name: Setup Node.js
        if: ${{ matrix.setup_node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.setup_node_version }}

      - name: Run custom setup
        if: ${{ matrix.setup_command }}
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.setup_command }}

      - name: Validate output for ${{ matrix.lang }}
        continue-on-error: ${{ matrix.optional == true }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test_language.sh "${{ matrix.lang }}" "${TEST_LENGTH}"
