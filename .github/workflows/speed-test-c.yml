name: Kmer Speed Test [C]

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "c/**"
      - "Makefile"
      - ".github/workflows/_speed-test-reusable.yml"
      - ".github/workflows/speed-test-c.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "c/**"
      - "Makefile"
      - ".github/workflows/_speed-test-reusable.yml"
      - ".github/workflows/speed-test-c.yml"

permissions:
  contents: read

jobs:
  kmer:
    uses: ./.github/workflows/_speed-test-reusable.yml
    with:
      display: "C"
      lang: "c"
